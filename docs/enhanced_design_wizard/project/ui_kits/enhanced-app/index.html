<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Enhanced — App UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #FAFAFA; }
  body { font-family: 'Cantarell', system-ui, sans-serif; color: #0A0A0A; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { font-family: 'Kedebideri', 'Cantarell', system-ui, sans-serif; }
  #app { height: 100vh; display: flex; flex-direction: column; }
  .screen-tabs {
    height: 40px; background: #0A0A0A; color: #FAFAFA;
    display: flex; align-items: center; gap: 4px; padding: 0 12px; flex-shrink: 0;
  }
  .screen-tabs .label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #737373; font-weight: 400; margin-right: 16px; }
  .screen-tabs button {
    background: transparent; color: #A3A3A3; border: none;
    height: 28px; padding: 0 12px; border-radius: 6px;
    font-family: 'Cantarell', system-ui, sans-serif; font-size: 13px; font-weight: 400;
    cursor: pointer;
  }
  .screen-tabs button:hover { background: rgba(255,255,255,0.05); color: #FAFAFA; }
  .screen-tabs button.active { background: #FAFAFA; color: #0A0A0A; }
  .app-shell { flex: 1; display: flex; overflow: hidden; background: #FFFFFF; }
  .canvas { flex: 1; background: #FFFFFF; overflow: auto; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(220,38,38,0.45); }
    70% { box-shadow: 0 0 0 14px rgba(220,38,38,0); }
    100% { box-shadow: 0 0 0 0 rgba(220,38,38,0); }
  }
  @keyframes caret { 50% { opacity: 0; } }
  @keyframes streamFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .stream-in { animation: streamFade 320ms ease-out both; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

// ---------- Screen: Compose ----------
function ComposeScreen({ goTo }) {
  return (
    <div className="app-shell">
      <Sidebar activeDraft={null} onNewDraft={() => goTo('draft')} />
      <div className="canvas">
        <Composer onGenerate={() => goTo('generating')} />
      </div>
    </div>
  );
}

// ---------- Screen: Generating (streaming) ----------
function GeneratingScreen({ goTo }) {
  const [progress, setProgress] = useState(0);
  const steps = [
    'Transcribing voice note',
    'Pulling cited sources',
    'Drafting "What you said"',
    'Drafting "What you assumed"',
    'Querying Mixpanel · 90d cohort',
    'Drafting "What we\'d need to prove"',
    'Cross-checking with support tickets',
    'Almost done',
  ];
  useEffect(() => {
    if (progress >= steps.length) {
      const t = setTimeout(() => goTo('draft'), 800);
      return () => clearTimeout(t);
    }
    const t = setTimeout(() => setProgress(p => p + 1), 700);
    return () => clearTimeout(t);
  }, [progress]);

  return (
    <div className="app-shell">
      <Sidebar activeDraft="d1" />
      <div className="canvas" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ maxWidth: 540, padding: 48, width: '100%' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 24 }}>
            <div style={{
              width: 36, height: 36, borderRadius: 9999, background: '#EFF6FF',
              display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            }}>
              <Icon name="sparkles" size={18} color="#2563EB" stroke={2} />
            </div>
            <div>
              <div style={{ fontFamily: "'Kedebideri'", fontWeight: 600, fontSize: 18, color: '#0A0A0A' }}>Drafting your PRD…</div>
              <div style={{ fontSize: 13, color: '#737373' }}>2 min voice note · about 8 sections</div>
            </div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {steps.map((s, i) => {
              const done = i < progress;
              const active = i === progress;
              return (
                <div key={i} style={{
                  display: 'flex', alignItems: 'center', gap: 10,
                  padding: '10px 14px', borderRadius: 10,
                  border: `1px solid ${active ? '#BFDBFE' : '#E5E5E5'}`,
                  background: active ? '#EFF6FF' : '#FFFFFF',
                  opacity: done ? 0.6 : 1,
                }}>
                  {done ? (
                    <Icon name="check" size={14} color="#2563EB" stroke={2.5} />
                  ) : active ? (
                    <div style={{ width: 14, height: 14, borderRadius: 9999, border: '2px solid #BFDBFE', borderTopColor: '#2563EB', animation: 'spin 0.8s linear infinite' }} />
                  ) : (
                    <div style={{ width: 14, height: 14, borderRadius: 9999, border: '1px solid #E5E5E5' }} />
                  )}
                  <div style={{ fontSize: 14, color: active ? '#1E3A8A' : done ? '#737373' : '#0A0A0A', fontWeight: active ? 500 : 400 }}>
                    {s}
                  </div>
                  {active && (
                    <span style={{ marginLeft: 'auto', fontFamily: "'JetBrains Mono'", fontSize: 11, color: '#1D4ED8' }}>in progress</span>
                  )}
                </div>
              );
            })}
          </div>
          <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
        </div>
      </div>
    </div>
  );
}

// ---------- Screen: Draft (the main artifact) ----------
function DraftScreen({ goTo }) {
  const [showInspector, setShowInspector] = useState(true);
  return (
    <div className="app-shell" style={{ flexDirection: 'column' }}>
      <Toolbar title="Saved searches v1" status="In review" />
      <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>
        <Sidebar activeDraft="d1" onNewDraft={() => goTo('compose')} />
        <div className="canvas">
          <article style={{ maxWidth: 760, margin: '0 auto', padding: '40px 32px 96px', display: 'flex', flexDirection: 'column', gap: 16 }}>
            <header style={{ marginBottom: 8 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
                <Badge tone="brand">Draft · v1</Badge>
                <span style={{ fontFamily: "'JetBrains Mono'", fontSize: 12, color: '#A3A3A3' }}>
                  generated from voice · 2:14 · 4 minutes ago
                </span>
              </div>
              <h1 style={{ fontFamily: "'Kedebideri'", fontWeight: 600, fontSize: 36, letterSpacing: '-1.2px', lineHeight: '40px', color: '#0A0A0A', margin: '0 0 12px' }}>
                Saved searches for power users
              </h1>
              <p style={{ fontSize: 17, lineHeight: '27px', color: '#404040', margin: 0 }}>
                A way for power users to persist filter combinations across sessions so they stop re-doing the same setup every morning.
              </p>
            </header>

            <PRDSection label="What you said you want" confidence="stated">
              A way for power users to <strong>persist filter combinations</strong> across sessions, so they stop losing context when they come back the next day. Specifically the table view in the Insights tab.
            </PRDSection>

            <PRDSection label="What you implicitly assumed" confidence="needs check">
              That power users currently lose their filters between sessions, and that this loss is a meaningful friction point. The first claim is verifiable; the second is the one to interrogate.
            </PRDSection>

            <EvidenceCallout kind="found" label="Evidence found · 1 of 2 assumptions" sources={['mixpanel']}>
              Power users (tier_pro) hit the Insights filter view <strong>4.2x per session</strong> on average, and re-apply the same combination of filters <strong>83% of the time</strong> within the first 90 seconds. <span style={{ fontFamily: "'JetBrains Mono'", fontSize: 13 }}>filter_apply_repeat / session</span> — 90d window.
            </EvidenceCallout>

            <EvidenceCallout kind="missing" label="No evidence found · 1 of 2 assumptions">
              <strong>0 support tickets</strong> in the last 90 days mention "lost filter", "filter reset", or related terms across 1,847 conversations. Either users have learned to live with it, or it's not actually the friction you think.
            </EvidenceCallout>

            <PRDSection label="What we'd need to prove before build">
              <ol style={{ paddingLeft: 20, margin: 0, display: 'flex', flexDirection: 'column', gap: 8 }}>
                <li>That the 4.2x-per-session repetition is a <strong>top-3 friction point</strong> for this ICP, not a vocal-minority ask.</li>
                <li>That a "save this view" pattern is preferred to <strong>auto-remember last filter</strong> (lower-cost alternative).</li>
                <li>That tier_pro <strong>willingness-to-pay</strong> moves on this — i.e. it's worth the eng investment vs. the next thing in the queue.</li>
              </ol>
            </PRDSection>

            <EvidenceCallout kind="question" label="One question first">
              Should we ship "auto-remember last filter" behind a flag for tier_pro and measure intent before designing the full saved-searches UI? Cheapest test, ~2 days of work.
            </EvidenceCallout>

            <PRDSection label="Prior work on this">
              <p style={{ margin: '0 0 10px 0' }}>This isn't the first time the team has looked at this — there's prior context worth reading before drafting v2.</p>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {[
                  { src: 'linear', title: 'ENG-2104 — Filter persistence', meta: 'Won\'t do · Q3 2024 · Closed by Théo' },
                  { src: 'notion', title: 'Insights v2 research notes', meta: 'Last edited Mar 14 · Camille' },
                ].map((s, i) => (
                  <a key={i} href="#" style={{
                    padding: '10px 14px', borderRadius: 8, background: '#FAFAFA', border: '1px solid #E5E5E5',
                    display: 'flex', alignItems: 'center', gap: 10, textDecoration: 'none',
                  }}>
                    <SourceChip source={s.src} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13, color: '#0A0A0A', fontWeight: 400 }}>{s.title}</div>
                      <div style={{ fontFamily: "'JetBrains Mono'", fontSize: 11, color: '#A3A3A3', marginTop: 2 }}>{s.meta}</div>
                    </div>
                    <Icon name="arrowRight" size={14} color="#A3A3A3" />
                  </a>
                ))}
              </div>
            </PRDSection>

            <div style={{ display: 'flex', gap: 10, paddingTop: 12, justifyContent: 'space-between', alignItems: 'center', borderTop: '1px solid #E5E5E5', marginTop: 8 }}>
              <span style={{ fontFamily: "'JetBrains Mono'", fontSize: 12, color: '#A3A3A3' }}>412 words · auto-saved 2 min ago</span>
              <div style={{ display: 'flex', gap: 8 }}>
                <Button variant="outline" leftIcon="sparkles">Regenerate section</Button>
                <Button variant="primary" rightIcon="arrowRight">Send to team</Button>
              </div>
            </div>
          </article>
        </div>
        {showInspector && <Inspector onClose={() => setShowInspector(false)} />}
      </div>
    </div>
  );
}

// ---------- Screen: Transcript ----------
function TranscriptScreen({ goTo }) {
  return (
    <div className="app-shell" style={{ flexDirection: 'column' }}>
      <Toolbar title="Saved searches v1 · voice transcript" status="Draft" />
      <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>
        <Sidebar activeDraft="d1" />
        <div className="canvas">
          <div style={{ maxWidth: 720, margin: '0 auto', padding: '40px 32px 80px' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 24 }}>
              <Badge tone="outline">Voice · 2:14</Badge>
              <span style={{ fontFamily: "'JetBrains Mono'", fontSize: 12, color: '#A3A3A3' }}>recorded 4 min ago · transcribed locally</span>
              <div style={{ flex: 1 }} />
              <Button variant="outline" size="sm" leftIcon="play">Replay</Button>
              <Button variant="outline" size="sm">Re-draft from this</Button>
            </div>

            <h2 style={{ fontFamily: "'Kedebideri'", fontWeight: 600, fontSize: 24, letterSpacing: '-1px', color: '#0A0A0A', margin: '0 0 18px' }}>
              Voice transcript
            </h2>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              {[
                { ts: '00:00', text: 'OK so I want to add a saved-searches feature.' },
                { ts: '00:04', text: 'The idea is that power users — like the ones on the pro tier — they spend a lot of time setting up the same filters over and over.', highlight: 'power users' },
                { ts: '00:21', text: 'Every time they open Insights they have to redo the same five-or-six clicks to get to the view they actually care about.', highlight: 'redo' },
                { ts: '00:38', text: 'And I think they\'re losing filters between sessions, like, the table view doesn\'t persist what you had selected when you come back the next day.', highlight: 'losing filters' },
                { ts: '00:54', text: 'So I want a "save this view" button somewhere in the top right of the filter bar, and then a little dropdown of saved views you can switch between.' },
                { ts: '01:14', text: 'I don\'t know exactly what the UI should look like yet but functionally that\'s the shape of it.' },
                { ts: '01:30', text: 'Also probably worth thinking about — should saved searches be shareable across the team or strictly personal? I lean personal first.' },
                { ts: '01:58', text: 'OK, that\'s the gist. Draft me the PRD and tell me what we\'re actually missing.' },
              ].map((seg, i) => {
                const highlighted = seg.highlight ? seg.text.split(new RegExp(`(${seg.highlight})`, 'i')) : [seg.text];
                return (
                  <div key={i} style={{ display: 'flex', gap: 14 }}>
                    <span style={{
                      fontFamily: "'JetBrains Mono'", fontSize: 12, color: '#A3A3A3',
                      width: 50, flexShrink: 0, paddingTop: 2,
                    }}>{seg.ts}</span>
                    <p style={{ margin: 0, fontSize: 16, lineHeight: '26px', color: '#262626', fontStyle: 'italic' }}>
                      {highlighted.map((part, j) => (
                        seg.highlight && part.toLowerCase() === seg.highlight.toLowerCase() ? (
                          <mark key={j} style={{ background: '#DBEAFE', color: '#1E40AF', padding: '0 4px', borderRadius: 4 }}>{part}</mark>
                        ) : (
                          <React.Fragment key={j}>{part}</React.Fragment>
                        )
                      ))}
                    </p>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ---------- Root ----------
function App() {
  const [screen, setScreen] = useState('compose');
  const screens = [
    { id: 'compose', label: 'Compose (empty)' },
    { id: 'generating', label: 'Generating' },
    { id: 'draft', label: 'Draft view' },
    { id: 'transcript', label: 'Voice transcript' },
  ];

  return (
    <>
      <div className="screen-tabs">
        <span className="label">Enhanced UI Kit</span>
        {screens.map(s => (
          <button key={s.id} className={screen === s.id ? 'active' : ''} onClick={() => setScreen(s.id)}>
            {s.label}
          </button>
        ))}
      </div>
      {screen === 'compose' && <ComposeScreen goTo={setScreen} />}
      {screen === 'generating' && <GeneratingScreen goTo={setScreen} />}
      {screen === 'draft' && <DraftScreen goTo={setScreen} />}
      {screen === 'transcript' && <TranscriptScreen goTo={setScreen} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
