<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="lbl">Buttons · sentence case · 10px radius · 36px tall default</div>
  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
    <button style="background:#171717; color:#FFFFFF; border:none; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px;">Primary</button>
    <button style="background:#F5F5F5; color:#171717; border:1px solid #E5E5E5; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px;">Secondary</button>
    <button style="background:#FFFFFF; color:#171717; border:1px solid #E5E5E5; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px;">Outline</button>
    <button style="background:transparent; color:#404040; border:none; height:36px; padding:0 12px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px;">Ghost</button>
    <button style="background:#2563EB; color:#FFFFFF; border:none; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px;">Brand</button>
    <button style="background:#DC2626; color:#FFFFFF; border:none; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px;">Destructive</button>
  </div>
  <div style="display:flex; gap:10px; align-items:center;">
    <button style="background:#171717; color:#FFFFFF; border:none; height:28px; padding:0 12px; border-radius:8px; font-family:'Kedebideri'; font-weight:500; font-size:13px;">Small</button>
    <button style="background:#171717; color:#FFFFFF; border:none; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px;">Default</button>
    <button style="background:#171717; color:#FFFFFF; border:none; height:44px; padding:0 20px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:15px;">Large</button>
    <button style="background:#FFFFFF; color:#171717; border:1px solid #E5E5E5; height:36px; padding:0 14px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px; display:flex; align-items:center; gap:8px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 5v14M5 12h14"/></svg>
      New draft
    </button>
  </div>
</div></body></html>
