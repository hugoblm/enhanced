<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="lbl">Button states — primary</div>
  <div style="display:grid; grid-template-columns:repeat(4,auto); gap:12px; align-items:center;">
    <button style="background:#171717; color:#FFF; border:none; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px;">Default</button>
    <button style="background:#404040; color:#FFF; border:none; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px;">Hover</button>
    <button style="background:#0A0A0A; color:#FFF; border:none; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px; box-shadow:0 0 0 2px #FFFFFF, 0 0 0 4px #2563EB;">Focus</button>
    <button style="background:#171717; color:#FFF; border:none; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px; opacity:0.5;">Disabled</button>
  </div>
  <div class="lbl">Outline states</div>
  <div style="display:grid; grid-template-columns:repeat(4,auto); gap:12px; align-items:center;">
    <button style="background:#FFF; color:#171717; border:1px solid #E5E5E5; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px;">Default</button>
    <button style="background:#FAFAFA; color:#171717; border:1px solid #D4D4D4; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px;">Hover</button>
    <button style="background:#F5F5F5; color:#171717; border:1px solid #D4D4D4; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px;">Active</button>
    <button style="background:#FFF; color:#A3A3A3; border:1px solid #E5E5E5; height:36px; padding:0 16px; border-radius:10px; font-family:'Kedebideri'; font-weight:500; font-size:14px;">Disabled</button>
  </div>
</div></body></html>
