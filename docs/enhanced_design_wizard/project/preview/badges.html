<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="lbl">Badges & chips</div>
  <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
    <span style="background:#171717; color:#FAFAFA; padding:3px 10px; border-radius:6px; font-size:12px; font-family:'Kedebideri'; font-weight:500;">Default</span>
    <span style="background:#F5F5F5; color:#171717; padding:3px 10px; border-radius:6px; font-size:12px; font-family:'Kedebideri'; font-weight:500;">Secondary</span>
    <span style="background:#FFFFFF; color:#404040; border:1px solid #E5E5E5; padding:3px 10px; border-radius:6px; font-size:12px; font-family:'Kedebideri'; font-weight:500;">Outline</span>
    <span style="background:#DBEAFE; color:#1E40AF; padding:3px 10px; border-radius:6px; font-size:12px; font-family:'Kedebideri'; font-weight:500;">Brand</span>
    <span style="background:#FEF2F2; color:#DC2626; border:1px solid #FECACA; padding:3px 10px; border-radius:6px; font-size:12px; font-family:'Kedebideri'; font-weight:500;">No evidence</span>
  </div>
  <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
    <span style="display:inline-flex; align-items:center; gap:6px; background:#FFFFFF; color:#0A0A0A; border:1px solid #E5E5E5; padding:4px 10px; border-radius:9999px; font-size:12px; font-family:'Kedebideri'; font-weight:500;">
      <span style="width:6px; height:6px; border-radius:50%; background:#2563EB;"></span>In review
    </span>
    <span style="display:inline-flex; align-items:center; gap:6px; background:#FFFFFF; color:#0A0A0A; border:1px solid #E5E5E5; padding:4px 10px; border-radius:9999px; font-size:12px; font-family:'Kedebideri'; font-weight:500;">
      <span style="width:6px; height:6px; border-radius:50%; background:#16A34A;"></span>Validated
    </span>
    <span style="display:inline-flex; align-items:center; gap:6px; background:#FFFFFF; color:#0A0A0A; border:1px solid #E5E5E5; padding:4px 10px; border-radius:9999px; font-size:12px; font-family:'Kedebideri'; font-weight:500;">
      <span style="width:6px; height:6px; border-radius:50%; background:#A3A3A3;"></span>Draft
    </span>
    <span style="display:inline-flex; align-items:center; gap:6px; background:#FFFFFF; color:#0A0A0A; border:1px solid #E5E5E5; padding:4px 10px; border-radius:9999px; font-size:12px; font-weight:500; font-family:'JetBrains Mono';">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>mixpanel
    </span>
  </div>
</div></body></html>
