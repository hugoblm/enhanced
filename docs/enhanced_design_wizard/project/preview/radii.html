<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="lbl">Radii · 10px default</div>
  <div style="display:flex; gap:16px; align-items:flex-end;">
    
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:60px; height:60px; background:#FAFAFA; border:1px solid #E5E5E5; border-radius:2px;"></div>
        <div style="font-size:11px; font-weight:400; color:#262626;">xs</div>
        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#A3A3A3;">2px</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:60px; height:60px; background:#FAFAFA; border:1px solid #E5E5E5; border-radius:4px;"></div>
        <div style="font-size:11px; font-weight:400; color:#262626;">sm</div>
        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#A3A3A3;">4px</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:60px; height:60px; background:#FAFAFA; border:1px solid #E5E5E5; border-radius:6px;"></div>

        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#A3A3A3;">6px</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:60px; height:60px; background:#FAFAFA; border:1px solid #E5E5E5; border-radius:8px;"></div>

        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#A3A3A3;">8px</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:60px; height:60px; background:#FAFAFA; border:1px solid #E5E5E5; border-radius:10px;"></div>
        <div style="font-size:11px; font-weight:400; color:#262626;">default</div>
        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#A3A3A3;">10px</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:60px; height:60px; background:#FAFAFA; border:1px solid #E5E5E5; border-radius:12px;"></div>

        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#A3A3A3;">12px</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:60px; height:60px; background:#FAFAFA; border:1px solid #E5E5E5; border-radius:16px;"></div>
        <div style="font-size:11px; font-weight:400; color:#262626;">2xl</div>
        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#A3A3A3;">16px</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:60px; height:60px; background:#FAFAFA; border:1px solid #E5E5E5; border-radius:24px;"></div>
        <div style="font-size:11px; font-weight:400; color:#262626;">3xl</div>
        <div style="font-family:'JetBrains Mono'; font-size:10px; color:#A3A3A3;">24px</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
        <div style="width:60px; height:60px; background:#FAFAFA; border:1px solid #E5E5E5; border-radius:9999px;"></div>
        <div style="font-size:11px; font-weight:400; color:#262626;">full</div>
