<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card">
  <div class="lbl">Inputs · 36px tall · 10px radius · hairline border</div>
  <input placeholder="Search drafts, voice notes…" style="height:36px; padding:0 12px; border:1px solid #E5E5E5; background:#FFFFFF; border-radius:10px; font-family:'Kedebideri'; font-size:14px; color:#0A0A0A; outline:none; width:100%;">
  <input value="Saved searches v1" style="height:36px; padding:0 12px; border:1px solid #2563EB; background:#FFFFFF; border-radius:10px; font-family:'Kedebideri'; font-size:14px; color:#0A0A0A; outline:none; box-shadow:0 0 0 2px rgba(37,99,235,0.18);">
  <textarea rows="2" placeholder="Drop a voice note or paste your raw idea here…" style="padding:10px 12px; border:1px solid #E5E5E5; background:#FFFFFF; border-radius:10px; font-family:'Kedebideri'; font-size:14px; color:#0A0A0A; outline:none; resize:none; width:100%;"></textarea>
</div></body></html>
