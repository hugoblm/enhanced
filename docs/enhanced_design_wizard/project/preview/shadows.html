<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card" style="background:#FAFAFA;">
  <div class="lbl">Elevation · reserved for floating surfaces</div>
  <div style="display:flex; gap:20px; padding:20px 0 8px;">
    
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div style="width:78px; height:78px; background:#FFFFFF; border-radius:10px; box-shadow:0 1px 0 0 rgba(0,0,0,0.05);"></div>
        <div style="font-size:11px; font-weight:400; color:#262626;">2xs</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div style="width:78px; height:78px; background:#FFFFFF; border-radius:10px; box-shadow:0 1px 2px 0 rgba(0,0,0,0.05);"></div>
        <div style="font-size:11px; font-weight:400; color:#262626;">xs</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div style="width:78px; height:78px; background:#FFFFFF; border-radius:10px; box-shadow:0 1px 3px 0 rgba(0,0,0,.10), 0 1px 2px -1px rgba(0,0,0,.10);"></div>
        <div style="font-size:11px; font-weight:400; color:#262626;">sm</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div style="width:78px; height:78px; background:#FFFFFF; border-radius:10px; box-shadow:0 4px 6px -1px rgba(0,0,0,.10), 0 2px 4px -2px rgba(0,0,0,.10);"></div>
        <div style="font-size:11px; font-weight:400; color:#262626;">md</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div style="width:78px; height:78px; background:#FFFFFF; border-radius:10px; box-shadow:0 10px 15px -3px rgba(0,0,0,.10), 0 4px 6px -4px rgba(0,0,0,.10);"></div>
        <div style="font-size:11px; font-weight:400; color:#262626;">lg</div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
        <div style="width:78px; height:78px; background:#FFFFFF; border-radius:10px; box-shadow:0 20px 25px -5px rgba(0,0,0,.10), 0 8px 10px -6px rgba(0,0,0,.10);"></div>
        <div style="font-size:11px; font-weight:400; color:#262626;">xl</div>
      </div>
  </div>
</div></body></html>
